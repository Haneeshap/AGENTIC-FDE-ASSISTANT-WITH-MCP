version: '3.8'

services:
  mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    ports:
      - '8001:8001'
    depends_on:
      - postgres
      - redis
    environment:
      - JIRA_API_KEY=
      - GITHUB_TOKEN=
      - SLACK_BOT_TOKEN=
      - NOTION_API_KEY=
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/mcp

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mcp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
